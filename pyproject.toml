[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "repogym"
version = "0.2.0"
description = "Turn real software issues into reproducible, testable AI coding tasks."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "RepoGym contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "defusedxml>=0.7,<1",
  "jinja2>=3.1,<4",
  "psutil>=5.9,<8",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.9,<2",
  "build>=1.2,<2",
  "hatchling>=1.25",
  "mypy>=1.10,<2",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "types-defusedxml>=0.7.0.20260504",
  "types-psutil>=5.9,<8",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
repogym = "repogym.cli:app"

[project.urls]
Changelog = "https://github.com/chenwei217/RepoGym/blob/main/CHANGELOG.md"
Documentation = "https://github.com/chenwei217/RepoGym/tree/main/docs"
Issues = "https://github.com/chenwei217/RepoGym/issues"
Repository = "https://github.com/chenwei217/RepoGym"

[tool.hatch.build.targets.wheel]
packages = ["src/repogym"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["repogym"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["repogym"]

[tool.bandit]
exclude_dirs = ["tests", "tasks", "examples"]
skips = ["B404", "B603", "B607"]
