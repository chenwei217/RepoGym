name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/repogym
      - run: pytest --cov=repogym --cov-report=term-missing --cov-report=xml
      - run: repogym verify tasks/python-cache-ttl
      - run: repogym verify tasks/python-config-merge
      - name: Doctor smoke tests
        run: |
          repogym doctor tasks/python-cache-ttl
          repogym doctor tasks/python-config-merge
      - name: Comparison smoke test
        run: |
          repogym grade tasks/python-cache-ttl --submission examples/submissions/cache-ttl-broken
          repogym grade tasks/python-cache-ttl --submission examples/submissions/cache-ttl-fixed
          python -c "import subprocess; from pathlib import Path; runs=sorted(Path('.repogym/runs').iterdir()); subprocess.run(['repogym','compare',str(runs[0]),str(runs[1])],check=True); subprocess.run(['repogym','compare',str(runs[0]),str(runs[1]),'--format','json','--output','.repogym/comparison.json'],check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
