name: Automated Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify immutable tag and release metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${RELEASE_SHA}"
          PROJECT_VERSION="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "${RELEASE_TAG}" = "v${PROJECT_VERSION}"
          test -f "docs/releases/${RELEASE_TAG}.md"
          grep -F "## [${PROJECT_VERSION}] -" CHANGELOG.md
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and verify distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip>=26.2" "build>=1.2,<2" "hatchling>=1.25"
          python -m build --no-isolation
          python -m venv /tmp/repogym-release
          /tmp/repogym-release/bin/python -m pip install --no-index --no-deps dist/repogym-*.whl
          /tmp/repogym-release/bin/repogym version
          (cd dist && sha256sum repogym-*.whl repogym-*.tar.gz > SHA256SUMS)
      - name: Attest distributions for public repositories
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/repogym-*.whl
            dist/repogym-*.tar.gz
      - name: Publish immutable GitHub Release
        shell: bash
        run: >-
          gh release create "${RELEASE_TAG}"
          dist/repogym-*.whl dist/repogym-*.tar.gz dist/SHA256SUMS
          --verify-tag --title "RepoGym ${RELEASE_TAG}"
          --notes-file "docs/releases/${RELEASE_TAG}.md"
